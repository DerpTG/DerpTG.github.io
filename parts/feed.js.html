var feedList = document.getElementById('feedList');

/* Escape any characters that could break the row markup. */
function fesc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* Build one expandable row per entry. */
LOG.forEach(function (entry, i) {
  var row = document.createElement('article');
  row.className = 'feed-row sev-' + entry.sev;

  // The tool tags shown in the Stack column.
  var tools = entry.tools.map(function (t) {
    return '<span class="chip">' + fesc(t) + '</span>';
  }).join('');

  // The hidden body bullets, revealed on expand. Escaped for the same reason
  // the archive records are: tool and framework names carry ampersands.
  var body = '<ul class="pts">' + entry.body.map(function (p) {
    return '<li>' + fesc(p) + '</li>';
  }).join('') + '</ul>';

  row.innerHTML =
    '<button class="feed-btn" aria-expanded="false">' +
      '<span class="feed-sev">' + entry.sev.toUpperCase() + '</span>' +
      '<span class="feed-status">' + fesc(entry.status) + '</span>' +
      '<span class="feed-title">' + fesc(entry.title) + '</span>' +
      '<span class="feed-tools">' + tools + '</span>' +
      '<span class="feed-caret">+</span>' +
    '</button>' +
    '<div class="feed-body"><div class="feed-in"><div class="feed-pad">' + body + '</div></div></div>';

  // Clicking the row header toggles it open and flips the +/- caret.
  var btn = row.querySelector('.feed-btn');
  btn.addEventListener('click', function () {
    var open = row.classList.toggle('on');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    row.querySelector('.feed-caret').textContent = open ? '\u2212' : '+';
  });

  feedList.appendChild(row);
});
</script>
