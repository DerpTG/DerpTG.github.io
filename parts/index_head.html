<script>
/* Tag <html> before the first paint if the intro is due. .intro pauses the
   hero's load sequence. Setting it from main.js paints the hero first and
   flashes the site. Bails on reduced motion and after the first view. */
(function(){try{
  var r=document.documentElement, m=window.matchMedia;
  if(sessionStorage.getItem('fn.intro.seen'))return;
  if(m&&m('(prefers-reduced-motion: reduce)').matches)return;
  r.className+=' intro';
}catch(e){}})();
</script>
