<script>
/* The interests, in the order they appear in the list. */
var INTERESTS = [
  {
    key: 'watchmaking', name: 'Watchmaking', tag: 'Obsession',
    lines: [
      'Watches in general, not just one kind. A mechanical movement running a few hundred parts off a wound spring is incredible, but so is solar quartz that charges off a desk lamp and holds time better than anything mechanical ever will. Every one of them has a story behind why it was built that way.',
      'I wrote a paper on it in school, on what actually separates a normal watch from haute horlogerie. The answer turned out to be hand-finishing, most of which you need a loupe to even see.'
    ]
  },
  {
    key: 'pc-building', name: 'Building computers', tag: 'Hands-on',
    lines: [
      'I build my own machines and put them together for other people. One of these is mine, the other two I built for family and friends.',
      'They almost always post on the first try, which I take as a good sign that the planning is where the real work is.'
    ],
    imgs: [
      ['img/builds/build-3', 'My own machine. Noctua Chromax cooler, EVGA 3080, and cabling I spent longer on than I want to admit.'],
      ['img/builds/build-2', 'A build for my younger cousin, running a 3060. Part way through cable management here.'],
      ['img/builds/build-1', 'A build for a friend. Z690 Tomahawk board and an EVGA RTX card, first boot up on the monitor behind it.']
    ]
  },
  {
    key: 'food', name: 'Food', tag: 'Always',
    lines: [
      'Finding somewhere new to eat is most of what I do with friends and family. Philly makes that easy, and I will happily drive an hour for something worth driving for.',
      'I will try anything once, which is how most of these ended up on my phone.'
    ],
    imgs: [
      ['img/food/food-1', 'Escargot, and the bread situation that comes with it.'],
      ['img/food/food-2', 'Sushi. The eel is always the first thing I order.'],
      ['img/food/food-3', 'Wagyu cooking on a hoba leaf over charcoal at the table.']
    ]
  },
  {
    key: 'fitness', name: 'Gym and getting outside', tag: 'Active',
    lines: [
      'I hit the gym a few nights a week, partly because it is quieter then and partly because that is when the same group of us are all there. It is a good way to end a day that was otherwise entirely screens.',
      'When the weather is decent I am out on the bike or walking with family and friends. Less about training, more about being outside and actually catching up with people.'
    ]
  },
  {
    key: 'community', name: 'Around Philly', tag: 'Local',
    lines: [
      'I commuted through school, so I never really left home. That worked out better than I expected.',
      'I get into the city when I can. Usually food, sometimes a show, occasionally whatever is happening downtown that weekend.'
    ]
  },
  {
    key: 'watching', name: 'Books and movies', tag: 'Downtime',
    lines: [
      'Dystopian series are what I read. The Hunger Games and the Maze Runner started it, then James Dashner\u2019s Mortality Doctrine books, Marie Lu\u2019s Legend trilogy, and Victoria Aveyard\u2019s Red Queen series. Harry Potter is not dystopian and I do not care, it is still the one I reread.',
      'Movies are a different story. Action, superhero, and comedy, basically anything with The Rock or Jason Statham in it, and I will watch an Adam Sandler movie without needing a reason.'
    ]
  }
];

var intList = document.getElementById('intList');
var intOut = document.getElementById('intOut');

/* Escape characters that could break the terminal markup. */
function iesc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* Build the clickable list on the left. First entry starts selected. */
INTERESTS.forEach(function (it, i) {
  var b = document.createElement('button');
  b.className = 'smp' + (i === 0 ? ' on' : '');
  b.innerHTML =
    '<span class="fn">' + iesc(it.name) + '</span>' +
    '<span class="fam">' + iesc(it.tag.toUpperCase()) + '</span>';
  b.addEventListener('click', function () {
    intList.querySelectorAll('.smp').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    renderInterest(i);
  });
  intList.appendChild(b);
});

/* Print interest i into the output pane as fake command output. */
function renderInterest(i) {
  var it = INTERESTS[i], h = '';
  // The typed command line.
  h += '<span class="ln"><span class="p">$</span> <span class="v">cat ' + iesc(it.key) + '.txt</span></span><span class="blank"></span>';
  // A small header line.
  h += '<span class="ln"><span class="cool">' + iesc(it.name) + '</span> <span class="k">[' + iesc(it.tag) + ']</span></span><span class="blank"></span>';
  // The body paragraphs.
  it.lines.forEach(function (line) {
    h += '<span class="ln"><span class="v">' + iesc(line) + '</span></span>';
  });
  // Optional photo strip. Only the entries that have pictures get one.
  if (it.imgs && it.imgs.length) {
    h += '<span class="blank"></span>';
    h += '<span class="ln"><span class="p">$</span> <span class="v">open ' + iesc(it.key) + '/*.jpg</span></span>';
    h += '<span class="shots">';
    it.imgs.forEach(function (im) {
      h += '<button class="shot-thumb" data-lightbox data-full="' + im[0] + '.jpg" ' +
             'data-caption="' + iesc(im[1]) + '" aria-label="Open photo: ' + iesc(im[1]) + '">' +
             '<img src="' + im[0] + '-sm.jpg" width="500" height="375" loading="lazy" alt="">' +
           '</button>';
    });
    h += '</span>';
  }
  // A fresh prompt with a blinking cursor.
  h += '<span class="blank"></span><span class="ln"><span class="p">$</span> <span class="cursor"></span></span>';
  intOut.innerHTML = h;
}

/* The console rewrites its output pane, so any thumbnails it just drew are
   new nodes. Tell the lightbox to pick them up. */
document.addEventListener('click', function (e) {
  if (e.target.closest('#intList .smp')) {
    window.setTimeout(function () {
      document.dispatchEvent(new CustomEvent('lightbox:rescan'));
    }, 0);
  }
});

renderInterest(0);  // open on the first interest
</script>
