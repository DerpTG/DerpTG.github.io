<script>
/* The interests, in the order they appear in the list. */
var INTERESTS = [
  {
    key: 'watchmaking', name: 'Watches', tag: 'Obsession',
    lines: [
      'I collect watches, mechanical and quartz both. A mechanical movement running off a wound spring is a small miracle, but solar quartz charging off a desk lamp and keeping better time than any of them is its own kind of clever. Every watch was built to solve something, and that is the part I like.',
      'I wrote a paper in school on what separates an ordinary watch from haute horlogerie. It comes down to hand-finishing you need a loupe to see at all.'
    ],
    imgs: [
      ['img/watches/watch-1', 'Glycine Airman. 24-hour dial.'],
      ['img/watches/watch-2', 'Tag Heuer Grand Carrera.'],
      ['img/watches/watch-3', 'Citizen Navihawk. Solar powered, slide-rule bezel.']
    ]
  },
  {
    key: 'pc-building', name: 'Building computers', tag: 'Hands-on',
    lines: [
      'I build my own machines and put them together for other people. One of these is mine, the other two went to family and friends.',
      'They almost always post on the first try, which tells me the planning is where the actual work happens.'
    ],
    imgs: [
      ['img/builds/build-3', 'My build. Noctua Chromax cooler, EVGA 3080.'],
      ['img/builds/build-2', 'Build for my cousin. RTX 3060.'],
      ['img/builds/build-1', 'Build for a friend. Z690 Tomahawk board, EVGA RTX card.']
    ]
  },
  {
    key: 'food', name: 'Food', tag: 'Always',
    lines: [
      'Finding somewhere new to eat is most of what I do with friends and family. Philly makes that easy, and I will drive an hour for something worth the drive.',
      'I try anything once, which is how most of these ended up on my phone.'
    ],
    imgs: [
      ['img/food/food-1', 'Escargot.'],
      ['img/food/food-2', 'Sushi and eel nigiri.'],
      ['img/food/food-3', 'Wagyu on a hoba leaf.']
    ]
  },
  {
    key: 'outdoors', name: 'Outdoors', tag: 'Active',
    lines: [
      'I get to the gym a few nights a week. It is quieter then, the same group of us are always there, and it is a good way to close out a day spent entirely on screens.',
      'Good weather means biking or walking with family and friends. Less training, more being outside and catching up with people.'
    ],
    imgs: [
      ['img/outdoors/out-1', 'Ocean City, New Jersey.'],
      ['img/outdoors/out-2', 'Biscayne Bay, Florida.'],
      ['img/outdoors/out-3', 'A garden near home.']
    ]
  },
  {
    key: 'community', name: 'Around Philly', tag: 'Local',
    lines: [
      'Commuting through school kept me close to home, which turned out to be worth more than I expected.',
      'I get into the city whenever I can. Usually food, sometimes a show, often whatever is going on downtown that weekend.'
    ]
  },
  {
    key: 'watching', name: 'Books and movies', tag: 'Downtime',
    lines: [
      'I read a lot of dystopian fiction. The Hunger Games and the Maze Runner got me started, and I went from there to James Dashner\u2019s Mortality Doctrine books, Marie Lu\u2019s Legend trilogy, and Victoria Aveyard\u2019s Red Queen series. Harry Potter is not dystopian and I do not care, it is still the one I reread.',
      'Movies are the opposite. Action, superhero, and comedy. Anything with The Rock or Jason Statham, and I will put on an Adam Sandler movie without needing a reason.'
    ]
  }
];

var intList = document.getElementById('intList');
var intOut = document.getElementById('intOut');

/* Escape characters that could break the terminal markup. */
function iesc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* Build the clickable list on the left. First entry starts selected. */
INTERESTS.forEach(function (it, i) {
  var b = document.createElement('button');
  b.className = 'smp' + (i === 0 ? ' on' : '');
  b.innerHTML =
    '<span class="fn">' + iesc(it.name) + '</span>' +
    '<span class="fam">' + iesc(it.tag.toUpperCase()) + '</span>';
  b.addEventListener('click', function () {
    intList.querySelectorAll('.smp').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    renderInterest(i);
  });
  intList.appendChild(b);
});

/* Print interest i into the output pane as fake command output. */
function renderInterest(i) {
  var it = INTERESTS[i], h = '';
  // The typed command line.
  h += '<span class="ln"><span class="p">$</span> <span class="v">cat ' + iesc(it.key) + '.txt</span></span><span class="blank"></span>';
  // A small header line.
  h += '<span class="ln"><span class="cool">' + iesc(it.name) + '</span> <span class="k">[' + iesc(it.tag) + ']</span></span><span class="blank"></span>';
  // The body paragraphs.
  it.lines.forEach(function (line) {
    h += '<span class="ln"><span class="v">' + iesc(line) + '</span></span>';
  });
  // Optional photo strip. Only the entries that have pictures get one.
  if (it.imgs && it.imgs.length) {
    h += '<span class="blank"></span>';
    h += '<span class="ln"><span class="p">$</span> <span class="v">open ' + iesc(it.key) + '/*.jpg</span></span>';
    h += '<span class="shots">';
    it.imgs.forEach(function (im) {
      h += '<button class="shot-thumb" data-lightbox data-full="' + im[0] + '.jpg" ' +
             'data-caption="' + iesc(im[1]) + '" aria-label="Open photo: ' + iesc(im[1]) + '">' +
             '<img src="' + im[0] + '-sm.jpg" width="500" height="375" loading="lazy" alt="">' +
           '</button>';
    });
    h += '</span>';
  }
  // A fresh prompt with a blinking cursor.
  h += '<span class="blank"></span><span class="ln"><span class="p">$</span> <span class="cursor"></span></span>';
  intOut.innerHTML = h;
}

/* The console rewrites its output pane, so any thumbnails it just drew are
   new nodes. Tell the lightbox to pick them up. */
document.addEventListener('click', function (e) {
  if (e.target.closest('#intList .smp')) {
    window.setTimeout(function () {
      document.dispatchEvent(new CustomEvent('lightbox:rescan'));
    }, 0);
  }
});

renderInterest(0);  // open on the first interest
</script>
