<script>
/* Kill chain */
var CHAIN=[
{t:"Initial access",a:"T1566.001 Spearphishing Attachment",
p:["An employee received an email from someone posing as an outside contractor. Attached was a malicious PDF, which dropped a first-stage trojan (NED32.exe) onto the workstation when opened.",
"Browser history and disk artifacts confirmed the PDF was downloaded immediately before the first malicious binary appeared. The mail server logged a traffic spike of roughly 143\u00d7 the normal baseline that same hour."],
m:["Wireshark","hMailServer logs","Disk artifacts"],
e:[["Vector","Phishing PDF","warm"],["Entry point","User workstation",""],["Dropped","NED32.exe","hot"],["First signal","Mail spike 143\u00d7","warm"],["Confirmed by","Browser + disk artifacts",""]]},

{t:"Execution",a:"T1204.002 Malicious File",
p:["Opening the PDF executed the first-stage dropper. The attacker then introduced a second tool (MRCv120.exe) that would carry the rest of the intrusion.",
"Memory analysis located that tool running from the Desktop under a Wow64 (32-bit-on-64-bit) environment, a path and binary that don\u2019t belong to Windows. Across seven memory captures, four hosts came back clean, which helped scope the compromise."],
m:["Volatility 2.6","pslist / psscan","imageinfo"],
e:[["Stage 1","NED32.exe (dropper)","warm"],["Stage 2","MRCv120.exe","hot"],["Environment","Wow64 (32-on-64)",""],["Found by","Volatility psscan",""],["Clean hosts","4 of 7 captures","cool"]]},

{t:"Defense evasion",a:"T1055 Process Injection \u00b7 T1562.001 Impair Defenses",
p:["The malware didn\u2019t stay in its own process. Volatility\u2019s malfind returned Read-Write-Execute memory segments inside trusted system processes (explorer.exe and svchost.exe), the signature of injected code or unpacked shellcode.",
"On one server the RWX memory appeared inside Windows Defender\u2019s own engine (MsMpEng.exe). Once an attacker is running inside the antivirus process, the antivirus stops being a control you can trust."],
m:["Volatility malfind","dlllist","Defender log review"],
e:[["Technique","RWX injection","hot"],["Hidden in","explorer / svchost",""],["AV tampered","MsMpEng.exe","hot"],["Tool","Volatility malfind",""],["Systems affected","3+",""],["Footprint","In-memory","warm"]]},

{t:"Lateral movement",a:"T1021 Remote Services \u00b7 T1078 Valid Accounts",
p:["MRCv120.exe appeared on the Administrator Desktop of both Windows Server 2016 domain controllers (WinServer_1 and WinServer_3). Landing there means the attacker had elevated domain privileges, not a standard user account.",
"The gap between the initial compromise and reaching the domain controllers was one hour and forty-four minutes. Whoever owns the domain controllers owns authentication for the whole network. Nothing was segmented to slow that down."],
m:["Volatility","ELK / Kibana DC logs","Timeline correlation"],
e:[["Targets","2 domain controllers","hot"],["Time to DC","1h 44m","hot"],["Privilege","Administrator","warm"],["Enabler","No segmentation","warm"],["Scope","Full domain","hot"]]},

{t:"Persistence",a:"T1543 Create or Modify System Process",
p:["A secondary payload (spaceman.exe) was planted on WinServer_3 alongside the primary tool. A second implant on a domain controller tells you the attacker was building a foothold meant to outlast the response.",
"System services on that host carried multiple persistent injected memory regions. Even a clean-looking reboot would not have removed them."],
m:["Volatility","svcscan","Memory + disk correlation"],
e:[["Payload","spaceman.exe","hot"],["Location","WinServer_3",""],["Method","Service injection",""],["Intent","Long-term access","hot"],["Found in","Memory + disk",""],["Weak point","Dormant accounts","warm"]]},

{t:"Exfiltration",a:"T1041 Exfiltration Over C2 Channel",
p:["The strongest evidence came from the mail server. Baseline traffic ran 80\u201395 events per hour. The peak hour hit roughly 22,500, about 235\u00d7 normal, with three more large spikes bracketing the intrusion, clustered on non-standard ports (5400\u20135700).",
"Volume on its own does not prove exfiltration, so I looked at what the traffic actually was. IMAP made up 96.5% of all mail events, which points to automated bulk access rather than people reading email. Shared-drive files across multiple departments had been modified during the window."],
m:["hMailServer logs","ELK / Kibana","Wireshark filters"],
e:[["Peak","~22,500 events/hr","hot"],["vs baseline","235\u00d7","hot"],["Ports","5400\u20135700","warm"],["IMAP share","96.5%","warm"],["Aborted conns","107",""],["At risk","Creds + sensitive data","hot"]]},

{t:"Impact",a:"T1486 Data Encrypted for Impact",
p:["On the final day, ransomware was written to the original victim workstation, and a ransom note appeared beside it minutes later. An employee found the note, and that discovery is what triggered the investigation.",
"Total dwell time from first compromise to ransom note was a little over four days. The attacker held the domain controllers for nearly all of it."],
m:["Autopsy","FTK Imager","Disk timeline"],
e:[["Action","Ransomware deployed","hot"],["Marker","Ransom note","hot"],["Dwell time","4 days","hot"],["Evidence base","12.7M pkts \u00b7 6 img \u00b7 7 mem","cool"],["Confidence","High","cool"]]}
];
// Cache the rail + the detail slots we rewrite on each stage change.
var rail=document.getElementById('rail'),kcT=document.getElementById('kcT'),kcA=document.getElementById('kcA'),kcP=document.getElementById('kcP'),kcM=document.getElementById('kcM'),kcE=document.getElementById('kcE');

// Fill the narrative + method + evidence panels from stage i.
function renderChain(i){
  var d=CHAIN[i];kcT.textContent=d.t;kcA.textContent=d.a;
  kcP.innerHTML=d.p.map(function(x){return '<p>'+x+'</p>'}).join('');
  // Tools/method line: a labeled row of the tools used at this stage.
  kcM.innerHTML='<span class="kc-method-lbl">Tools &amp; method</span>'+
    d.m.map(function(t){return '<span class="chip">'+t+'</span>'}).join('');
  // Each evidence row: [label, value, tone]; tone becomes a CSS class on <b>.
  kcE.innerHTML=d.e.map(function(r){var c=r[2]?' class="'+r[2]+'"':'';return '<div><span>'+r[0]+'</span><b'+c+'>'+r[1]+'</b></div>'}).join('');
}
// Wire each stage node: highlight it and render its data. data-i holds the index.
rail.querySelectorAll('.node').forEach(function(n){
  n.addEventListener('click',function(){
    rail.querySelectorAll('.node').forEach(function(x){x.classList.remove('on')});
    n.classList.add('on');renderChain(parseInt(n.dataset.i,10));
  });
});
renderChain(0);  // open on the first stage
</script>
