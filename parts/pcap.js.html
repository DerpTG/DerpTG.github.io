var pcapList=document.getElementById('pcapList'),pcapDetail=document.getElementById('pcapDetail');
var pOpen=null;
function pEsc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function pcapRender(){
  pcapList.innerHTML='';
  PACKETS.forEach(function(p,i){
    var row=document.createElement('button');
    row.className='pcap-row'+(p.tone?' t-'+p.tone:'');
    row.innerHTML=
      '<span class="c-no">'+p.no+'</span>'+
      '<span class="c-time">'+pEsc(p.time)+'</span>'+
      '<span class="c-src">'+pEsc(p.src)+'</span>'+
      '<span class="c-dst">'+pEsc(p.dst)+'</span>'+
      '<span class="c-proto">'+pEsc(p.proto)+'</span>'+
      '<span class="c-info">'+pEsc(p.info)+'</span>';
    row.addEventListener('click',function(){ pcapToggle(i,row); });
    pcapList.appendChild(row);
  });
}
function pcapToggle(i,row){
  if(pOpen===i){
    pOpen=null;pcapDetail.className='pcap-detail';pcapDetail.innerHTML='';
    pcapList.querySelectorAll('.pcap-row').forEach(function(r){r.classList.remove('on');});
    return;
  }
  pOpen=i;
  pcapList.querySelectorAll('.pcap-row').forEach(function(r){r.classList.remove('on');});
  if(row) row.classList.add('on');
  var p=PACKETS[i];
  var tree=p.tree.map(function(t){
    return '<div class="pkt-line"><span>'+pEsc(t[0])+'</span><b>'+pEsc(t[1])+'</b></div>';
  }).join('');
  pcapDetail.className='pcap-detail show'+(p.tone?' t-'+p.tone:'');
  pcapDetail.innerHTML=
    '<div class="pkt-tree"><span class="tag">Frame '+p.no+' \u00b7 dissection</span>'+tree+'</div>'+
    '<div class="pkt-note"><span class="tag">Why it\u2019s evidence</span><p>'+pEsc(p.note)+'</p></div>';
}
pcapRender();
