<script>
/* The project records. */
var PROJ = [
  {
    cat: 'This site', t: 'This Portfolio Site', team: 'Solo',
    sum: 'Static HTML, CSS, and vanilla JavaScript on GitHub Pages with a custom domain.',
    more: [
      'Built without a framework or a browser build step, using one stylesheet driven by CSS custom properties.',
      'Structured each interactive piece as a data array plus a render function to keep the codebase readable long-term.',
      'Presented casework as explorable detail rather than a list of claims, with automatic redeployment on every push.'
    ],
    skills: ['HTML', 'CSS', 'Vanilla JS', 'Git', 'GitHub Pages'],
    gh: 'https://github.com/DerpTG/DerpTG.github.io'
  },
  {
    cat: 'Networking', t: 'Networking and Systems Labs', team: 'Solo',
    sum: 'Enterprise network topologies built and troubleshot in Cisco Packet Tracer.',
    more: [
      'Built enterprise topologies from a blank canvas and an addressing plan rather than a template.',
      'Configured VLANs and VTP for segmentation, port security to restrict switch ports to known hosts, encrypted telnet access, and VoIP telephony across the same topology.',
      'Diagnosed trunk negotiation failures and inter-VLAN routing faults, building protocol-level understanding beyond a working configuration.'
    ],
    skills: ['Cisco Packet Tracer', 'VLANs', 'VTP', 'Port security', 'VoIP', 'IP addressing']
  },
  {
    cat: 'Incident response', t: 'Turbo Ransomware IR Playbook', team: 'Team of 6',
    sum: 'A full ransomware playbook for a scooter-share company, preparation through recovery, with NCISS-scored escalation tiers.',
    more: [
      'Produced a ransomware incident response playbook covering preparation through recovery.',
      'Defined NCISS-scored escalation tiers from Baseline, handled by the SOC alone, to Emergency, which convenes the full C-suite within ten minutes, each with a fixed score band and responder timeline to remove severity disputes mid-incident.',
      'Mapped the playbook to NIST RMF, COBIT 2019, and MITRE ATT&CK.',
      'Co-owned the Introduction, Detection and Initial Triage, and Containment sections, authored the Conclusion, and ran weekly scrums.',
      'Validated procedures through CISA-format tabletop exercises to identify steps that failed under pressure.'
    ],
    skills: ['NIST RMF', 'MITRE ATT&CK', 'COBIT 2019', 'NCISS', 'CISA tabletops']
  },
  {
    cat: 'Risk analysis', t: 'Elder Tech-Support Fraud Risk Analysis', team: 'Team of 4',
    sum: 'A semester-long risk assessment of a $1M+ retirement fund against a Microsoft refund scam.',
    more: [
      'Assessed the risk of an isolated 85-year-old losing a $1M+ retirement fund to a call-center scammer posing as a Microsoft refund specialist.',
      'Modeled the scam as a serial-dependency chain, from answering the call through granting remote access to authorizing the transfer, treating each link as an interdiction point.',
      'Scored six risks on likelihood and impact, ranging from outright financial loss to emotional harm and failure to report.',
      'Recommended layered mitigation across education, family check-in protocols, and technical safeguards.',
      'Documented an explicit residual-risk assessment establishing that no single layer withstands a skilled caller working a target in real time.'
    ],
    skills: ['MECE', 'Scenario matrix', 'Benefit-cost', 'Defense in depth']
  },
  {
    cat: 'Secure engineering', t: 'Secure Patient Data Pipeline', team: 'Team of 5',
    sum: 'A Java message-queuing pipeline that keeps patient records encrypted end to end.',
    more: [
      'Built a pipeline that AES-encrypts patient records before serialization, transports them through RabbitMQ as JSON, and decrypts only at the consumer.',
      'Held no record in the queue in cleartext, a single requirement that drove the remaining design decisions.',
      'Owned the encryption and decryption stages and the message-queuing flow.'
    ],
    skills: ['Java', 'RabbitMQ', 'AES', 'Maven', 'Gson'],
    gh: 'https://github.com/DerpTG/team6SystemIntegration'
  },
  {
    cat: 'Full stack', t: 'Alpha Web Storefront', team: 'Team of 2',
    sum: 'Project manager and UI lead on a MEAN-stack e-commerce storefront, delivered across eight milestones.',
    more: [
      'Delivered shopper accounts, product management, cart, shipping, billing, and returns, each as its own milestone with full CRUD and a written test plan.',
      'Built the front end in Angular, Bootstrap, and jQuery over a Node.js and MongoDB back end.',
      'Owned the schedule, coordinated the team, and made the interface decisions.'
    ],
    skills: ['Angular', 'Node.js', 'MongoDB', 'Bootstrap', 'jQuery'],
    gh: 'https://github.com/DerpTG/StoryTellersSite'
  }
];

var recList = document.getElementById('recList');

/* Escape characters that could break the record markup. */
function resc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* Build one expandable record per project. */
PROJ.forEach(function (p, i) {
  var rec = document.createElement('article');
  rec.className = 'rec-item';

  // The bullets shown when the record is expanded. Escaped, so an ampersand
  // in a framework name (MITRE ATT&CK) renders rather than opening an entity.
  var more = '<ul class="pts">' +
    p.more.map(function (x) { return '<li>' + resc(x) + '</li>'; }).join('') +
    '</ul>';

  // The labeled skills block: this is where each project's skills live.
  var skills = p.skills.map(function (s) {
    return '<span class="chip">' + resc(s) + '</span>';
  }).join('');

  // Optional GitHub link, shown inside the expanded detail if present.
  var ghLink = p.gh
    ? '<a class="gh" href="' + p.gh + '" target="_blank" rel="noopener">View code \u2192</a>'
    : '';

  // The number shown in the No. column, zero-padded for a log-file look.
  var no = ('0' + (i + 1)).slice(-2);

  rec.innerHTML =
    '<button class="rec-btn" aria-expanded="false">' +
      '<span class="rc-no">' + no + '</span>' +
      '<span class="rc-cat">' + resc(p.cat) + '</span>' +
      '<span class="rc-name">' + resc(p.t) + '</span>' +
      '<span class="rc-src">' + resc(p.team) + '</span>' +
      '<span class="rec-caret">+</span>' +
    '</button>' +
    // Always-visible skills strip, shown whether or not the record is open.
    '<div class="rec-skills-row"><span class="rsk-lbl">Skills</span>' +
      '<div class="rec-skills">' + skills + '</div></div>' +
    // Collapsible detail: the summary, the full story, and any code link.
    '<div class="rec-body"><div class="rec-in"><div class="rec-pad">' +
      '<p class="rec-sum">' + resc(p.sum) + '</p>' +
      more +
      (ghLink ? '<div class="rec-foot">' + ghLink + '</div>' : '') +
    '</div></div></div>';

  // Clicking the record header toggles it open and flips the +/- caret.
  var btn = rec.querySelector('.rec-btn');
  btn.addEventListener('click', function () {
    var open = rec.classList.toggle('on');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    rec.querySelector('.rec-caret').textContent = open ? '\u2212' : '+';
  });

  recList.appendChild(rec);
});
</script>
