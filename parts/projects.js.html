<script>
/* The project records. */
var PROJ = [
  {
    cat: 'This site', t: 'This Portfolio Site', team: 'Solo',
    sum: 'The site you are on. Static HTML, CSS, and vanilla JavaScript on GitHub Pages with a custom domain.',
    more: [
      'No framework and no build step for the browser. One stylesheet driven by CSS custom properties, and each interactive piece is a data array plus a render function, so the whole thing stays readable months later.',
      'The point was to let people click through the actual casework rather than read a list of claims about it. It redeploys on every push.'
    ],
    skills: ['HTML', 'CSS', 'Vanilla JS', 'Git', 'GitHub Pages'],
    gh: 'https://github.com/DerpTG/DerpTG.github.io'
  },
  {
    cat: 'Incident response', t: 'Turbo Ransomware IR Playbook', team: 'Team of 6',
    sum: 'A full ransomware playbook for a scooter-share company, preparation through recovery, with NCISS-scored escalation tiers.',
    more: [
      'Escalation ran from Baseline, handled by the SOC alone, up to Emergency, which puts the full C-suite in a room within ten minutes. Each tier has a concrete NCISS score band and a fixed responder timeline attached to it, so nobody has to argue about severity mid-incident.',
      'We mapped the playbook to NIST RMF, COBIT 2019, and MITRE ATT&CK. I co-owned Introduction, Detection and Initial Triage, and Containment, wrote the Conclusion, and ran the weekly scrums. Then we put it through CISA-format tabletops to find out which steps held up once people were under pressure.'
    ],
    skills: ['NIST RMF', 'MITRE ATT&CK', 'COBIT 2019', 'NCISS', 'CISA tabletops']
  },
  {
    cat: 'Risk analysis', t: 'Elder Tech-Support Fraud Risk Analysis', team: 'Team of 4',
    sum: 'A semester-long risk assessment of a $1M+ retirement fund against a Microsoft refund scam.',
    more: [
      'The scenario was an isolated 85-year-old about to lose a $1M+ retirement fund to a call-center scammer posing as a Microsoft refund specialist. I broke it into a chain: answer the call, trust the caller, grant remote access, log into the bank, authorize the transfer. Every link is somewhere the attack could still be stopped, which is the useful part. I scored six risks on likelihood and impact, from losing the money outright down to the emotional damage and never reporting it.',
      'What we recommended was layered: education, family check-ins, and technical safeguards together. The residual risk section says plainly that no single one of those holds up against a skilled caller working someone in real time.'
    ],
    skills: ['MECE', 'Scenario matrix', 'Benefit-cost', 'Defense in depth']
  },
  {
    cat: 'Secure engineering', t: 'Secure Patient Data Pipeline', team: 'Team of 5',
    sum: 'A Java message-queuing pipeline that keeps patient records encrypted end to end.',
    more: [
      'Records are AES-encrypted before serialization, travel through RabbitMQ as JSON, and only get decrypted at the consumer. Nothing sits in the queue in the clear, and that one requirement drove most of the design decisions after it.',
      'Built for IST 242 with a team of five. I worked the encryption and decryption stages and the queuing flow.'
    ],
    skills: ['Java', 'RabbitMQ', 'AES', 'Maven', 'Gson'],
    gh: 'https://github.com/DerpTG/team6SystemIntegration'
  },
  {
    cat: 'Full stack', t: 'Alpha Web Storefront', team: 'Team of 2',
    sum: 'Project manager and UI lead on a MEAN-stack e-commerce storefront, delivered across eight milestones.',
    more: [
      'Shopper accounts, product management, cart, shipping, billing, and returns, each shipped as its own milestone with CRUD behind it and a written test plan. Angular, Bootstrap, and jQuery on the front, Node.js and MongoDB behind it.',
      'I owned the schedule, kept the team coordinated, and made the interface calls.'
    ],
    skills: ['Angular', 'Node.js', 'MongoDB', 'Bootstrap', 'jQuery'],
    gh: 'https://github.com/DerpTG/StoryTellersSite'
  }
];

var recList = document.getElementById('recList');

/* Escape characters that could break the record markup. */
function resc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* Build one expandable record per project. */
PROJ.forEach(function (p, i) {
  var rec = document.createElement('article');
  rec.className = 'rec-item';

  // The paragraphs shown when the record is expanded.
  var more = p.more.map(function (x) { return '<p>' + x + '</p>'; }).join('');

  // The labeled skills block: this is where each project's skills live.
  var skills = p.skills.map(function (s) {
    return '<span class="chip">' + resc(s) + '</span>';
  }).join('');

  // Optional GitHub link, shown inside the expanded detail if present.
  var ghLink = p.gh
    ? '<a class="gh" href="' + p.gh + '" target="_blank" rel="noopener">View code \u2192</a>'
    : '';

  // The number shown in the No. column, zero-padded for a log-file look.
  var no = ('0' + (i + 1)).slice(-2);

  rec.innerHTML =
    '<button class="rec-btn" aria-expanded="false">' +
      '<span class="rc-no">' + no + '</span>' +
      '<span class="rc-cat">' + resc(p.cat) + '</span>' +
      '<span class="rc-name">' + resc(p.t) + '</span>' +
      '<span class="rc-src">' + resc(p.team) + '</span>' +
      '<span class="rec-caret">+</span>' +
    '</button>' +
    // Always-visible skills strip, shown whether or not the record is open.
    '<div class="rec-skills-row"><span class="rsk-lbl">Skills</span>' +
      '<div class="rec-skills">' + skills + '</div></div>' +
    // Collapsible detail: the summary, the full story, and any code link.
    '<div class="rec-body"><div class="rec-in"><div class="rec-pad">' +
      '<p class="rec-sum">' + resc(p.sum) + '</p>' +
      more +
      (ghLink ? '<div class="rec-foot">' + ghLink + '</div>' : '') +
    '</div></div></div>';

  // Clicking the record header toggles it open and flips the +/- caret.
  var btn = rec.querySelector('.rec-btn');
  btn.addEventListener('click', function () {
    var open = rec.classList.toggle('on');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    rec.querySelector('.rec-caret').textContent = open ? '\u2212' : '+';
  });

  recList.appendChild(rec);
});
</script>
